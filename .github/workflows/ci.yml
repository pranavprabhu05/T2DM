name: public-aggregate-validation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-release:
    name: Frozen release verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: faa5799fa01d8d7381ea43415fbec01036d1e4ff
          fetch-depth: 0
          persist-credentials: false
      - name: Check immutable release identity
        run: |
          test "$(git rev-parse HEAD)" = "faa5799fa01d8d7381ea43415fbec01036d1e4ff"
          test "$(git rev-parse HEAD^{tree})" = "25d6e6dee449ad917e459230ca5fd6f5155aa7f2"
          test "$(git rev-parse refs/tags/v1.0.0-paper)" = "d8c74928df54445954683f6239b02b344f1ac4fe"
          test "$(git rev-parse refs/tags/v1.0.0-paper^{commit})" = "faa5799fa01d8d7381ea43415fbec01036d1e4ff"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: pip
      - name: Install locked checkout
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify environment and public boundary
        run: |
          python scripts/verify_environment.py
          python scripts/verify_publication_results.py
          python publication_release/verify_snapshot.py
          python publication_release/verify_public_aggregates.py
          python publication_release/verify_manuscript_sources.py
      - name: Portable tests and aggregate reconstructions
        env:
          MPLCONFIGDIR: outputs/.matplotlib
        run: |
          python -m pytest -q -m "not local_research_data"
          python scripts/finalize_journal_handoff.py reconstruct --destination outputs/ci-tables
          python publication_release/paper_evidence/REGENERATE_FIGURES.py outputs/ci-figures

  current-documentation:
    name: Current documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - name: Install documentation parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test documentation and preservation checks
        run: python -m unittest discover -s .github/ci -p 'test_current_documentation.py' -v
      - name: Validate current documentation and immutable file boundary
        run: python .github/ci/verify_current_documentation.py
