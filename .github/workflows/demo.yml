name: research-demo
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  aggregate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo/requirements.lock
      - name: Install isolated demo dependencies
        run: |
          python -m pip install -r demo/requirements.lock
          python -m pip check
      - name: Test source boundaries and Streamlit interactions
        run: python -m pytest -q demo/tests
      - name: Export self-contained panel fallback
        run: python -m demo.export_offline --output outputs/panel-demo.html
      - uses: actions/upload-artifact@v4
        with:
          name: offline-panel-demo
          path: outputs/panel-demo.html
